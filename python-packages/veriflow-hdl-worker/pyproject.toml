[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "veriflow-hdl-worker"
version = "1.3.2"
requires-python = ">=3.8"
dependencies = [
    "importlib-resources>=5.10; python_version < '3.9'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veriflow_hdl_worker = [
    "bin/parser-worker.exe",
    "bin/web-tree-sitter.wasm",
    "bin/tree-sitter-systemverilog.wasm",
    "bin/manifest.json",
]
