[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriflow"
version = "1.2.1"
description = "Lightweight Verilog simulation flow manager with GUI, CLI, and VS Code extension support."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "AlexMercer12138" }
]
dependencies = [
  "PySide6>=6.5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0"
]
build = [
  "pyinstaller>=6.0.0"
]

[project.scripts]
veriflow = "src.presentation.cli:main"
veriflow-gui = "src.presentation.gui.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning"
]

