[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriflow"
version = "1.4.0"
description = "Deprecated Python GUI/CLI compatibility release for Vik-VeriFlow."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "AlexMercer12138" }
]
dependencies = [
  "PySide6>=6.5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "PyYAML==6.0.3"
]
build = [
  "pyinstaller>=6.0.0"
]

[project.scripts]
veriflow = "src.presentation.cli:deprecated_main"
veriflow-gui = "src.presentation.gui.__main__:deprecated_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning"
]
