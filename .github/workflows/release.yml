name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  verify-main-ci:
    name: Verify successful main CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify CI succeeded for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ci_run_id="$(gh run list \
            --workflow ci.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$ci_run_id"

  node-artifacts:
    name: Node CLI and VS Code artifacts
    needs: verify-main-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate installed Icarus source provenance
        run: node scripts/lib/iverilog-source.mjs validate --package-root node_modules/@veriflow/iverilog-wasm --expected-version 0.1.2

      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Smoke clean npm artifacts
        run: npm run test:release

      - name: Pack Node release artifacts
        run: npm run pack:node

      - name: Pack VS Code extension
        run: npm run package --workspace veriflow-vscode

      - name: Stage release artifacts
        run: |
          mkdir -p release-assets
          cp dist/npm/*.tgz release-assets/
          cp veriflow-vscode/*.vsix release-assets/

      - name: Create Icarus corresponding-source archive
        run: node scripts/lib/iverilog-source.mjs archive --package-root node_modules/@veriflow/iverilog-wasm --expected-version 0.1.2 --destination release-assets

      - name: Verify Icarus corresponding-source archive
        run: test -s release-assets/iverilog-wasm-source-*.tar.gz

      - name: Upload Node and VS Code artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-node-release
          if-no-files-found: error
          path: release-assets/*

  finalize-release-assets:
    name: Finalize release artifacts
    needs: node-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v4
        with:
          name: veriflow-node-release
          path: release-assets

      - name: Generate checksums
        run: |
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Upload final release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-final-release
          if-no-files-found: error
          path: release-assets/*

  github-release:
    name: Publish GitHub Release
    needs: finalize-release-assets
    runs-on: ubuntu-latest
    environment:
      name: gpl-release-review
    permissions:
      contents: write

    steps:
      - name: Download final release artifacts
        uses: actions/download-artifact@v4
        with:
          name: veriflow-final-release
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "Vik-VeriFlow $GITHUB_REF_NAME"
