name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  verify-main-ci:
    name: Verify successful main CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify CI succeeded for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ci_run_id="$(gh run list \
            --workflow ci.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$ci_run_id"

  node-artifacts:
    name: Node CLI and VS Code artifacts
    needs: verify-main-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Smoke clean npm artifacts
        run: npm run test:release

      - name: Pack Node release artifacts
        run: npm run pack:node

      - name: Pack VS Code extension
        run: npm run package --workspace veriflow-vscode

      - name: Stage release artifacts
        run: |
          mkdir -p release-assets
          cp dist/npm/*.tgz release-assets/
          cp veriflow-vscode/*.vsix release-assets/

      - name: Upload Node and VS Code artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-node-release
          if-no-files-found: error
          path: release-assets/*

  python-deprecation-artifacts:
    name: Deprecated Python artifacts (Windows)
    needs: verify-main-ci
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "package.json" | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match v$version"
          }

      - name: Build shared waveform assets
        run: npm run build:web

      - name: Install deprecated Python product dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build deprecated Python products
        run: |
          python -m PyInstaller --clean --noconfirm VeriFlow.spec
          python -m PyInstaller --clean --noconfirm VeriFlow-cli.spec

      - name: Smoke deprecated Python CLI artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath "dist/VeriFlow.exe" -PathType Leaf)) {
            throw "Missing dist/VeriFlow.exe"
          }
          $cliOutput = (& "dist/VeriFlow-cli.exe" --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Deprecated Python CLI smoke failed" }
          if ($cliOutput -notmatch "Python CLI is deprecated") {
            throw "Deprecated Python CLI warning was not emitted"
          }

      - name: Stage deprecated Python artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          Copy-Item -LiteralPath "dist/VeriFlow.exe" -Destination "release-assets/"
          Copy-Item -LiteralPath "dist/VeriFlow-cli.exe" -Destination "release-assets/"

      - name: Upload deprecated Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-python-deprecation-windows
          if-no-files-found: error
          path: release-assets/*

  github-release:
    name: Publish GitHub Release
    needs: [node-artifacts, python-deprecation-artifacts]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "Vik-VeriFlow $GITHUB_REF_NAME"
